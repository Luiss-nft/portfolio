<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala 4x2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F6;
    --surface:#FFFFFF;
    --border:#E3E6E9;
    --text:#15181C;
    --text-muted:#767D87;
    --text-faint:#A6ACB3;
    --a:#2563EB;
    --a-soft:#DBEAFE;
    --b:#7C3AED;
    --b-soft:#EDE9FE;
    --c:#DC2626;
    --c-soft:#FEE2E2;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(20,23,27,0.04), 0 8px 24px rgba(20,23,27,0.06);
    --note-bg:#FFF9E6;
    --note-border:#E8D8B0;
    --cor-dia:#F59E0B;
    --cor-noite:#3B82F6;
    --cor-folga:#EF4444;
  }

  [data-theme="dark"]{
    --bg:#1A1D23;
    --surface:#24282F;
    --border:#333840;
    --text:#E8ECF0;
    --text-muted:#9AA3AE;
    --text-faint:#6B7480;
    --a:#60A5FA;
    --a-soft:#1E293B;
    --b:#A78BFA;
    --b-soft:#2D1B4E;
    --c:#F87171;
    --c-soft:#3B1A1A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --note-bg:#2D2A1E;
    --note-border:#4A4530;
    --cor-dia:#FBBF24;
    --cor-noite:#60A5FA;
    --cor-folga:#F87171;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 40px;
    -webkit-font-smoothing:antialiased;
    transition:background .3s, color .3s;
  }

  button{font-family:inherit;cursor:pointer;}

  svg.icon{
    width:18px;height:18px;
    stroke:currentColor;
    stroke-width:1.75;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    display:block;
    flex-shrink:0;
  }

  .app{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px;
    flex-wrap:wrap;
    gap:8px;
  }

  .app-header .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .app-header .today-date{
    font-size:0.78rem;
    color:var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .header-actions{
    display:flex;
    gap:6px;
    align-items:center;
  }

  .header-actions button{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:50%;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    cursor:pointer;
    transition:.2s;
    box-shadow:var(--shadow);
  }

  .header-actions button:hover{
    border-color:var(--text);
    color:var(--text);
  }

  /* ===== CARD SLIDER ===== */
  .card-wrapper{width:100%;overflow:hidden;border-radius:var(--radius-lg);}

  .cards-slider{
    display:flex;
    transition:transform .45s cubic-bezier(.65,0,.35,1);
    width:100%;
  }

  .turno-card{
    min-width:100%;
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px 22px 18px;
    position:relative;
    overflow:hidden;
    transition:background .3s, border .3s;
  }

  .turno-a{--accent:var(--a);--accent-soft:var(--a-soft);}
  .turno-b{--accent:var(--b);--accent-soft:var(--b-soft);}
  .turno-c{--accent:var(--c);--accent-soft:var(--c-soft);}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .icon-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.02em;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }

  .icon-btn:hover{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }

  .icon-btn.icon-only{padding:8px;}

  .card-identity{
    display:flex;
    align-items:flex-end;
    gap:14px;
    margin-bottom:14px;
  }

  .letra{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(2.6rem, 12vw, 3.2rem);
    font-weight:700;
    line-height:0.9;
    color:var(--accent);
  }

  .identity-meta{padding-bottom:4px;}

  .equipe{
    font-size:0.95rem;
    font-weight:600;
    color:var(--text);
  }

  .equipe-label{
    font-size:0.72rem;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .status-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:0.86rem;
    font-weight:600;
    margin-bottom:16px;
  }

  .status-chip svg{width:16px;height:16px;}

  /* cycle tracker */
  .cycle{
    display:flex;
    gap:5px;
    margin-bottom:16px;
  }

  .cycle .seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--border);
  }

  .cycle .seg.active{background:var(--accent);}

  .cycle-labels{
    display:flex;
    gap:5px;
    margin-top:5px;
    margin-bottom:2px;
  }

  .cycle-labels span{
    flex:1;
    text-align:center;
    font-size:0.6rem;
    font-weight:600;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }

  .cycle-labels span.active-label{color:var(--accent);}

  .trabalhadores{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
    max-height:240px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .trabalhadores::-webkit-scrollbar{width:4px;}
  .trabalhadores::-webkit-scrollbar-track{background:transparent;}
  .trabalhadores::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  .trabalhador-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    background:var(--bg);
    font-size:0.88rem;
    transition:background .2s;
  }

  .trabalhador-item:hover{
    background:var(--border);
  }

  .trabalhador-item .who{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--text);
  }

  .trabalhador-item .who svg{
    color:var(--text-faint);
  }

  .trabalhador-item .matricula{
    color:var(--text-faint);
    font-size:0.78rem;
    font-variant-numeric:tabular-nums;
  }

  .trabalhador-item .status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
    flex-shrink:0;
  }

  .trabalhador-item .status-dot.presente{
    background:#22C55E;
  }

  .trabalhador-item .status-dot.folga{
    background:#F59E0B;
  }

  .contador-trabalhadores{
    font-size:0.72rem;
    color:var(--text-faint);
    text-align:right;
    padding:4px 6px 0 0;
  }

  /* ===== NAV ===== */
  .navegacao{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }

  .nav-btn{
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
    box-shadow:var(--shadow);
  }

  .nav-btn:hover{border-color:var(--text);}

  .nav-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;}
  .nav-btn:disabled:hover{border-color:var(--border);}

  .indicador{display:flex;gap:7px;align-items:center;}

  .indicador span{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--border);
    transition:.25s;
  }

  .indicador span.active{
    background:var(--text);
    width:20px;
    border-radius:4px;
  }

  /* ===== DAY CONTROLS ===== */
  .controles-dia{display:flex;gap:10px;width:100%;}

  .controles-dia button{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:0.86rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    box-shadow:var(--shadow);
  }

  .controles-dia .btn-hoje{color:var(--a);}
  .controles-dia .btn-hoje:hover{background:var(--a-soft);border-color:var(--a);}

  .controles-dia .btn-avancar{background:var(--text);color:#fff;border-color:var(--text);}
  .controles-dia .btn-avancar:hover{opacity:.85;}

  .info-turno{
    text-align:center;
    color:var(--text-faint);
    font-size:0.78rem;
    letter-spacing:0.02em;
  }

  /* ===== MODALS ===== */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,23,27,0.45);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:20px;
  }

  .modal-overlay.active{display:flex;}

  .modal{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:22px;
    max-width:440px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 24px 60px rgba(20,23,27,0.28);
    transition:background .3s;
  }

  .modal::-webkit-scrollbar{width:4px;}
  .modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
  }

  .modal-header h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.02rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:9px;
  }

  .modal-header h2 svg{color:var(--text-muted);}

  .fechar{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:var(--bg);
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    transition:.2s;
  }

  .fechar:hover{background:var(--border);color:var(--text);}

  .calendario-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }

  .calendario-nav button{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:50%;
    color:var(--text-muted);
    cursor:pointer;
    transition:.2s;
  }

  .calendario-nav button:hover{border-color:var(--text);color:var(--text);}

  .mes-label{
    font-size:0.92rem;
    font-weight:600;
    text-transform:capitalize;
  }

  .calendario-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }

  .cal-header{
    text-align:center;
    color:var(--text-faint);
    font-size:0.62rem;
    font-weight:600;
    padding:6px 2px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }

  .cal-dia{
    background:var(--bg);
    border-radius:10px;
    padding:8px 2px;
    text-align:center;
    min-height:54px;
    border:1.5px solid transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
  }

  .cal-dia .numero{
    font-size:0.8rem;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    font-weight:600;
  }

  .cal-dia svg{
    width:15px;
    height:15px;
  }

  /* Cores específicas para cada status no calendário - APENAS ÍCONES */
  .cal-dia.status-dia svg{
    stroke:var(--cor-dia);
    fill:var(--cor-dia);
  }

  .cal-dia.status-noite svg{
    stroke:var(--cor-noite);
    fill:var(--cor-noite);
  }

  .cal-dia.status-folga svg{
    stroke:var(--cor-folga);
    fill:var(--cor-folga);
  }

  .cal-dia.hoje{
    border-color:var(--text);
    background:var(--surface);
  }
  .cal-dia.hoje .numero{
    font-weight:700;
  }

  .cal-legenda{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }

  .cal-legenda span{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.74rem;
    color:var(--text-muted);
  }

  .cal-legenda svg{
    width:14px;
    height:14px;
  }

  .cal-legenda .legenda-dia svg{
    stroke:var(--cor-dia);
    fill:var(--cor-dia);
  }

  .cal-legenda .legenda-noite svg{
    stroke:var(--cor-noite);
    fill:var(--cor-noite);
  }

  .cal-legenda .legenda-folga svg{
    stroke:var(--cor-folga);
    fill:var(--cor-folga);
  }

  /* ===== O.S MODAL ===== */
  .item-os{
    display:flex;
    gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--border);
  }

  .item-os:last-child{border-bottom:none;}

  .item-os .os-icon{
    width:36px;height:36px;
    border-radius:10px;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
    flex-shrink:0;
  }

  .item-os .local{font-weight:600;color:var(--text);font-size:0.94rem;}
  .item-os .os-codigo{color:var(--a);font-size:0.78rem;font-weight:600;margin-top:2px;}
  .item-os .lotes{color:var(--text-faint);font-size:0.76rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;}

  .item-os .lotes span{
    background:var(--bg);
    padding:2px 8px;
    border-radius:6px;
    color:var(--text-muted);
  }

  /* ===== NOTE / ALARM ===== */
  .note-container{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow);
    transition:background .3s, border .3s;
  }

  .note-container .note-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }

  .note-container .note-header h3{
    font-size:0.85rem;
    font-weight:600;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:8px;
  }

  .note-container .note-header .note-actions{
    display:flex;
    gap:6px;
  }

  .note-container .note-header .note-actions button{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    cursor:pointer;
    transition:.2s;
  }

  .note-container .note-header .note-actions button:hover{
    border-color:var(--text);
    color:var(--text);
  }

  .note-container .note-header .note-actions button.active-alarm{
    background:var(--a-soft);
    border-color:var(--a);
    color:var(--a);
  }

  .note-textarea{
    width:100%;
    min-height:70px;
    background:var(--note-bg);
    border:1px solid var(--note-border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:0.88rem;
    font-family:inherit;
    color:var(--text);
    resize:vertical;
    transition:background .3s, border .3s, color .3s;
  }

  .note-textarea:focus{
    outline:none;
    border-color:var(--a);
  }

  .note-alarm-info{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    font-size:0.72rem;
    color:var(--text-faint);
    flex-wrap:wrap;
  }

  .note-alarm-info .alarm-status{
    display:flex;
    align-items:center;
    gap:4px;
    font-weight:500;
  }

  .note-alarm-info .alarm-status.active{
    color:var(--a);
  }

  .note-alarm-info .alarm-countdown{
    color:var(--text-muted);
  }

  /* ===== MODAL NOTAS ===== */
  .note-modal-text{
    width:100%;
    min-height:120px;
    background:var(--note-bg);
    border:1px solid var(--note-border);
    border-radius:var(--radius-sm);
    padding:12px;
    font-size:0.92rem;
    font-family:inherit;
    color:var(--text);
    resize:vertical;
    transition:background .3s, border .3s, color .3s;
  }

  .note-modal-text:focus{
    outline:none;
    border-color:var(--a);
  }

  .note-modal-options{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
  }

  .note-modal-options label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.82rem;
    color:var(--text-muted);
    cursor:pointer;
  }

  .note-modal-options input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--a);
    cursor:pointer;
  }

  .note-modal-options .alarm-interval{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
  }

  .note-modal-options .alarm-interval select{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:4px 8px;
    font-size:0.8rem;
    color:var(--text);
    font-family:inherit;
  }

  .note-modal-options .alarm-interval select:focus{
    outline:none;
    border-color:var(--a);
  }

  .note-modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }

  .note-modal-actions button{
    flex:1;
    padding:10px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    transition:.2s;
  }

  .note-modal-actions .btn-save{
    background:var(--text);
    color:#fff;
    border-color:var(--text);
  }

  .note-modal-actions .btn-save:hover{opacity:.85;}

  .loading-message{
    text-align:center;
    padding:20px;
    color:var(--text-faint);
    font-size:0.9rem;
  }

  @media (max-width:380px){
    .turno-card{padding:18px 16px 16px;}
    .nav-btn{width:38px;height:38px;}
  }

  @media (prefers-reduced-motion: reduce){
    .cards-slider{transition:none;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <span class="eyebrow">Escala 4×2</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="today-date" id="dataAtual"></span>
      <div class="header-actions">
        <button onclick="toggleTheme()" title="Alternar tema">
          <svg class="icon" viewBox="0 0 24 24" id="themeIcon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <button onclick="abrirNoteModal()" title="Bloco de notas / Alarme">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="cards-slider" id="cardsSlider">

      <div class="turno-card turno-a">
        <div class="card-top">
          <button class="icon-btn" onclick="abrirOS()">

  // ====== LÓGICA ESCALA 4x2 ======
  const CICLO = ['DIA', 'DIA', 'NOITE', 'NOITE', 'FOLGA', 'FOLGA'];
  const POSICAO_INICIAL = { 669: 0, 667: 2, 668: 4 };

  function getPosicaoCiclo(equipe, date) {
    const baseDate = new Date(2026, 6, 27);
    const diffDays = Math.floor((date - baseDate) / (1000 * 60 * 60 * 24));
    const posInicial = POSICAO_INICIAL[equipe] || 0;
    let pos = (posInicial + diffDays) % 6;
    if (pos < 0) pos += 6;
    return pos;
  }

  function getTurnoDia(equipe, date) {
    const pos = getPosicaoCiclo(equipe, date);
    const status = CICLO[pos];
    if (status === 'DIA') return 0;
    if (status === 'NOITE') return 1;
    return 2;
  }

  function getStatusInfo(status) {
    const map = {
      0: { label: 'Dia', icon: ICON_SUN },
      1: { label: 'Noite', icon: ICON_MOON },
      2: { label: 'Folga', icon: ICON_PAUSE }
    };
    return map[status] || map[0];
  }

  function getIconStatus(status) {
    const map = { 0: ICON_SUN, 1: ICON_MOON, 2: ICON_PAUSE };
    return map[status] || ICON_SUN;
  }

  // ====== CONTROLE DE DATA ======
  let currentDate = new Date(2026, 6, 27);
  let cardAtual = 0;
  const totalCards = 3;

  // ====== CALENDÁRIO ======
  let mesCalendario = new Date(2026, 6, 1);
  let equipeCalendario = 667;
  let letraCalendario = 'A';

  // ====== TEMA ======
  let temaEscuro = false;

  function toggleTheme() {
    temaEscuro = !temaEscuro;
    document.documentElement.setAttribute('data-theme', temaEscuro ? 'dark' : '');
    const icon = document.getElementById('themeIcon');
    if (temaEscuro) {
      icon.innerHTML = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';
    } else {
      icon.innerHTML = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>';
    }
    localStorage.setItem('temaEscuro', temaEscuro ? 'true' : 'false');
  }

  // ====== NOTAS E ALARME ======
  let notaData = {
    texto: '',
    alarmeAtivo: false,
    intervaloHoras: 3,
    ultimoToque: null
  };

  let alarmTimeoutId = null;
  let soundCtx = null;

  function playAlarmSound() {
    try {
      if (!soundCtx) {
        soundCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const now = soundCtx.currentTime;
      const frequencies = [523, 659, 784, 1047];
      frequencies.forEach((freq, i) => {
        const osc = soundCtx.createOscillator();
        const gain = soundCtx.createGain();
        osc.connect(gain);
        gain.connect(soundCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.2);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.2);
      });
    } catch (e) {
      console.log('Erro ao tocar som:', e);
    }
  }

  function notificarAlarme() {
    playAlarmSound();

    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('⏰ Alarme da Nota', {
        body: notaData.texto || 'Hora de verificar sua nota!',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%234A4F57"><circle cx="12" cy="13" r="7.5"/><path d="M12 8.5v5l3 2"/></svg>'
      });
    } else if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    notaData.ultimoToque = Date.now();
    salvarDados();
    atualizarDisplayNota();
  }

  function iniciarAlarme() {
    pararAlarme();
    if (!notaData.alarmeAtivo) return;

    const intervaloMs = notaData.intervaloHoras * 60 * 60 * 1000;
    let proximoToque;
    
    if (notaData.ultimoToque) {
      proximoToque = notaData.ultimoToque + intervaloMs;
      const agora = Date.now();
      if (proximoToque <= agora) {
        notificarAlarme();
        proximoToque = Date.now() + intervaloMs;
      }
    } else {
      proximoToque = Date.now() + intervaloMs;
    }

    const delay = proximoToque - Date.now();
    if (delay > 0) {
      alarmTimeoutId = setTimeout(() => {
        notificarAlarme();
        iniciarAlarme();
      }, delay);
    } else {
      notificarAlarme();
      iniciarAlarme();
    }

    atualizarDisplayNota();
  }

  function pararAlarme() {
    if (alarmTimeoutId) {
      clearTimeout(alarmTimeoutId);
      alarmTimeoutId = null;
    }
  }

  function toggleAlarme() {
    notaData.alarmeAtivo = !notaData.alarmeAtivo;
    if (notaData.alarmeAtivo) {
      notaData.ultimoToque = null;
      iniciarAlarme();
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    } else {
      pararAlarme();
    }
    salvarDados();
    atualizarDisplayNota();
    atualizarBotaoAlarme();
  }

  function atualizarBotaoAlarme() {
    const btn = document.getElementById('alarmToggleBtn');
    if (notaData.alarmeAtivo) {
      btn.classList.add('active-alarm');
    } else {
      btn.classList.remove('active-alarm');
    }
  }

  function abrirNoteModal() {
    document.getElementById('noteModalText').value = notaData.texto;
    document.getElementById('alarmCheckbox').checked = notaData.alarmeAtivo;
    document.getElementById('alarmInterval').value = notaData.intervaloHoras;
    document.getElementById('modalNote').classList.add('active');
  }

  function fecharNoteModal() {
    document.getElementById('modalNote').classList.remove('active');
  }

  function salvarNota() {
    const texto = document.getElementById('noteModalText').value;
    const alarmeAtivo = document.getElementById('alarmCheckbox').checked;
    const intervalo = parseInt(document.getElementById('alarmInterval').value) || 3;

    const alarmeMudou = notaData.alarmeAtivo !== alarmeAtivo;
    const intervaloMudou = notaData.intervaloHoras !== intervalo;

    notaData.texto = texto;
    notaData.alarmeAtivo = alarmeAtivo;
    notaData.intervaloHoras = intervalo;

    if (alarmeMudou || intervaloMudou) {
      notaData.ultimoToque = null;
      if (notaData.alarmeAtivo) {
        pararAlarme();
        iniciarAlarme();
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      } else {
        pararAlarme();
      }
    }

    salvarDados();
    atualizarDisplayNota();
    atualizarBotaoAlarme();
    fecharNoteModal();
  }

  function atualizarDisplayNota() {
    const display = document.getElementById('noteDisplay');
    display.value = notaData.texto || 'Nenhuma nota salva. Clique no lápis para editar.';

    const status = document.getElementById('alarmStatus');
    if (notaData.alarmeAtivo) {
      status.className = 'alarm-status active';
      status.innerHTML = `
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><circle cx="12" cy="13" r="7.5"/><path d="M12 8.5v5l3 2"/></svg>
        Alarme: Ligado (${notaData.intervaloHoras}h)
      `;
    } else {
      status.className = 'alarm-status';
      status.innerHTML = `
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><circle cx="12" cy="13" r="7.5"/><path d="M12 8.5v5l3 2"/></svg>
        Alarme: Desligado
      `;
    }

    const countdown = document.getElementById('alarmCountdown');
    if (notaData.alarmeAtivo && notaData.ultimoToque) {
      const prox = notaData.ultimoToque + (notaData.intervaloHoras * 60 * 60 * 1000);
      const diff = prox - Date.now();
      if (diff > 0) {
        const horas = Math.floor(diff / (60 * 60 * 1000));
        const minutos = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
        countdown.textContent = `Próximo: ${horas}h ${minutos}min`;
      } else {
        countdown.textContent = 'Tocando agora...';
      }
    } else if (notaData.alarmeAtivo) {
      countdown.textContent = 'Aguardando primeiro toque...';
    } else {
      countdown.textContent = '';
    }
  }

  // ====== SALVAR DADOS ======
  function salvarDados() {
    try {
      const dados = {
        nota: {
          texto: notaData.texto,
          alarmeAtivo: notaData.alarmeAtivo,
          intervaloHoras: notaData.intervaloHoras,
          ultimoToque: notaData.ultimoToque
        },
        data: currentDate.toISOString(),
        cardAtual: cardAtual
      };
      localStorage.setItem('escala4x2_dados', JSON.stringify(dados));
      console.log('✅ Dados salvos com sucesso!');
    } catch (e) {
      console.log('❌ Erro ao salvar dados:', e);
    }
  }

  function carregarDados() {
    try {
      const dados = localStorage.getItem('escala4x2_dados');
      if (dados) {
        const parsed = JSON.parse(dados);
        console.log('📂 Dados carregados:', parsed);
        
        if (parsed.nota) {
          notaData.texto = parsed.nota.texto || '';
          notaData.alarmeAtivo = parsed.nota.alarmeAtivo || false;
          notaData.intervaloHoras = parsed.nota.intervaloHoras || 3;
          notaData.ultimoToque = parsed.nota.ultimoToque || null;
          
          console.log('📝 Nota carregada:', notaData.texto);
          
          if (notaData.alarmeAtivo) {
            setTimeout(() => {
              iniciarAlarme();
              if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
              }
            }, 1000);
          }
        }
        
        if (parsed.data) {
          const dataSalva = new Date(parsed.data);
          if (!isNaN(dataSalva)) {
            currentDate = dataSalva;
            console.log('📅 Data carregada:', currentDate.toLocaleDateString());
          }
        }
        
        if (parsed.cardAtual !== undefined && parsed.cardAtual >= 0 && parsed.cardAtual < totalCards) {
          cardAtual = parsed.cardAtual;
        }
        return true;
      }
    } catch (e) {
      console.log('❌ Erro ao carregar dados:', e);
    }
    return false;
  }

  // ====== NAVEGAÇÃO CARDS ======
  function mudarCard(direcao) {
    const novoCard = cardAtual + direcao;
    if (novoCard < 0 || novoCard >= totalCards) return;
    cardAtual = novoCard;
    document.getElementById('cardsSlider').style.transform = `translateX(-${cardAtual * 100}%)`;
    atualizarIndicador();
    atualizarBotoes();
    atualizarInfo();
    salvarDados();
  }

  function atualizarIndicador() {
    document.querySelectorAll('.indicador span').forEach((dot, index) => {
      dot.classList.toggle('active', index === cardAtual);
    });
  }

  function atualizarBotoes() {
    document.getElementById('btnPrev').disabled = cardAtual === 0;
    document.getElementById('btnNext').disabled = cardAtual === totalCards - 1;
  }

  function atualizarInfo() {
    const nomes = ['Turno A · Equipe 667', 'Turno B · Equipe 668', 'Turno C · Equipe 669'];
    document.getElementById('infoTurno').textContent = nomes[cardAtual];
  }

  // ====== CONTROLE DE DIAS ======
  function avancarDia() {
    currentDate = new Date(currentDate);
    currentDate.setDate(currentDate.getDate() + 1);
    render();
    salvarDados();
  }

  function irHoje() {
    currentDate = new Date(2026, 6, 27);
    render();
    salvarDados();
  }

  // ====== CALENDÁRIO ======
  function abrirCalendario(equipe, letra) {
    equipeCalendario = equipe;
    letraCalendario = letra;
    document.getElementById('modalTitulo').textContent = `Turno ${letra} (${equipe})`;
    document.getElementById('modalCalendario').classList.add('active');
    document.getElementById('legendaDia').innerHTML = ICON_SUN + ' Dia';
    document.getElementById('legendaNoite').innerHTML = ICON_MOON + ' Noite';
    document.getElementById('legendaFolga').innerHTML = ICON_PAUSE + ' Folga';
    renderCalendario();
  }

  function fecharCalendario() {
    document.getElementById('modalCalendario').classList.remove('active');
  }

  function mudarMesCalendario(delta) {
    mesCalendario = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() + delta, 1);
    renderCalendario();
  }

  function renderCalendario() {
    const grid = document.getElementById('calendarioGrid');
    const ano = mesCalendario.getFullYear();
    const mes = mesCalendario.getMonth();

    document.getElementById('mesLabel').textContent = new Date(ano, mes).toLocaleDateString('pt-BR', {
      month: 'long',
      year: 'numeric'
    });

    const semana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const primeiroDia = new Date(ano, mes, 1);
    const ultimoDia = new Date(ano, mes + 1, 0);
    const hoje = currentDate;

    let html = semana.map(d => `<div class="cal-header">${d}</div>`).join('');

    const offset = primeiroDia.getDay();
    for (let i = 0; i < offset; i++) {
      html += `<div class="cal-dia" style="opacity:0.3;"></div>`;
    }

    for (let d = 1; d <= ultimoDia.getDate(); d++) {
      const data = new Date(ano, mes, d);
      const isHoje = data.toDateString() === hoje.toDateString();

      const status = getTurnoDia(equipeCalendario, data);
      const icon = getIconStatus(status);
      
      let classe = 'cal-dia';
      if (isHoje) classe += ' hoje';
      
      if (status === 0) classe += ' status-dia';
      else if (status === 1) classe += ' status-noite';
      else if (status === 2) classe += ' status-folga';

      html += `
        <div class="${classe}">
          <div class="numero">${d}</div>
          ${icon}
        </div>
      `;
    }

    grid.innerHTML = html;
  }

  // ====== O.S ======
  function renderOS() {
    const lista = document.getElementById('listaOS');
    lista.innerHTML = ordensServico.map(os => `
      <div class="item-os">
        <div class="os-icon">${ICON_HOME}</div>
        <div>
          <div class="local">${os.local}</div>
          <div class="os-codigo">O.S ${os.codigo}</div>
          <div class="lotes">${os.lotes.map(l => `<span>${l}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');
  }

  function abrirOS() {
    renderOS();
    document.getElementById('modalOS').classList.add('active');
  }

  function fecharOS() {
    document.getElementById('modalOS').classList.remove('active');
  }

  // Fechar modais com ESC
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      fecharCalendario();
      fecharOS();
      fecharNoteModal();
    }
  });

  // Fechar modais clicando fora
  document.getElementById('modalCalendario').addEventListener('click', function (e) {
    if (e.target === this) fecharCalendario();
  });

  document.getElementById('modalOS').addEventListener('click', function (e) {
    if (e.target === this) fecharOS();
  });

  document.getElementById('modalNote').addEventListener('click', function (e) {
    if (e.target === this) fecharNoteModal();
  });

  // ====== RENDERIZAR ======
  function render() {
    const date = currentDate;

    document.getElementById('dataAtual').textContent = date.toLocaleDateString('pt-BR', {
      day: '2-digit', month: 'short'
    });

    const turnos = [
      { letra: 'A', statusId: 'statusA', listaId: 'listaA', cycleId: 'cycleA', labelsId: 'cycleLabelsA', equipe: 667 },
      { letra: 'B', statusId: 'statusB', listaId: 'listaB', cycleId: 'cycleB', labelsId: 'cycleLabelsB', equipe: 668 },
      { letra: 'C', statusId: 'statusC', listaId: 'listaC', cycleId: 'cycleC', labelsId: 'cycleLabelsC', equipe: 669 }
    ];

    const cicloLetras = ['D','D','N','N','F','F'];

    turnos.forEach(({ statusId, listaId, cycleId, labelsId, equipe }) => {
      const status = getTurnoDia(equipe, date);
      const info = getStatusInfo(status);

      const chip = document.getElementById(statusId);
      if (chip) chip.innerHTML = info.icon + `<span>${info.label}</span>`;

      const posAtual = getPosicaoCiclo(equipe, date);
      const cycleEl = document.getElementById(cycleId);
      const labelsEl = document.getElementById(labelsId);
      if (cycleEl) {
        cycleEl.innerHTML = CICLO.map((_, i) =>
          `<div class="seg ${i === posAtual ? 'active' : ''}"></div>`
        ).join('');
      }
      if (labelsEl) {
        labelsEl.innerHTML = cicloLetras.map((l, i) =>
          `<span class="${i === posAtual ? 'active-label' : ''}">${l}</span>`
        ).join('');
      }

      const trabalhadores = workers.filter(w => w.equipe === equipe);
      const lista = document.getElementById(listaId);

      if (lista) {
        if (trabalhadores.length === 0) {
          lista.innerHTML = '<div class="trabalhador-item" style="color:var(--text-faint);justify-content:center;">Nenhum trabalhador</div>';
        } else {
          const isTrabalho = status === 0 || status === 1;
          lista.innerHTML = trabalhadores.map(w => `
            <div class="trabalhador-item">
              <span class="who">${ICON_USER}${w.nome}</span>
              <span class="matricula">${w.matricula}</span>
              <span class="status-dot ${isTrabalho ? 'presente' : 'folga'}"></span>
            </div>
          `).join('');
        }
      }
    });

    if (document.getElementById('modalCalendario').classList.contains('active')) {
      renderCalendario();
    }

    atualizarDisplayNota();
    atualizarBotaoAlarme();
    
    document.getElementById('cardsSlider').style.transform = `translateX(-${cardAtual * 100}%)`;
    atualizarIndicador();
    atualizarBotoes();
    atualizarInfo();
  }

  // ====== EVENTOS ======
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') mudarCard(-1);
    if (e.key === 'ArrowRight') mudarCard(1);
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') avancarDia();
  });

  // ====== INICIALIZAR ======
  function init() {
    console.log('🚀 Inicializando aplicação...');
    
    // Carregar tema
    const temaSalvo = localStorage.getItem('temaEscuro');
    if (temaSalvo === 'true') {
      temaEscuro = true;
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('themeIcon').innerHTML = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';
    }

    // Carregar dados salvos
    const dadosCarregados = carregarDados();
    console.log('📊 Dados carregados?', dadosCarregados);
    
    // Renderizar
    render();
    
    // Se não tinha dados salvos, salva o estado inicial
    if (!dadosCarregados) {
      console.log('💾 Salvando estado inicial...');
      salvarDados();
    }

    // Salvar dados periodicamente
    setInterval(() => {
      salvarDados();
      atualizarDisplayNota();
    }, 30000);

    // Verificar alarme a cada minuto
    setInterval(() => {
      if (notaData.alarmeAtivo && notaData.ultimoToque) {
        const prox = notaData.ultimoToque + (notaData.intervaloHoras * 60 * 60 * 1000);
        if (Date.now() >= prox) {
          notificarAlarme();
          notaData.ultimoToque = Date.now();
          salvarDados();
          iniciarAlarme();
        }
      }
      atualizarDisplayNota();
    }, 60000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
