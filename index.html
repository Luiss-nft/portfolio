<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Destaque Vertical · Shopee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .shopee-card {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 100vh;
            background: #ffffff;
            border-radius: 0;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.07), 0 2px 10px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== VÍDEO - OCUPA TODO O ESPAÇO DISPONÍVEL ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1 0 auto;
            background: #0b0b0b;
            cursor: pointer;
            overflow: hidden;
            min-height: 60px;
            /* Altura será controlada pelo JS */
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
            object-fit: cover;
        }

        /* LOGO SOBREPOSTA AO VÍDEO */
        .logo-overlay {
            position: absolute;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            max-width: 70px;
            width: 18%;
            height: auto;
            pointer-events: none;
        }

        .logo-overlay img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        /* Botão de play centralizado */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            width: 50px;
            height: 50px;
            background: rgba(238, 77, 45, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(238, 77, 45, 0.4);
            pointer-events: auto;
            opacity: 0;
        }

        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(238, 77, 45, 1);
        }

        .play-button i {
            color: white;
            font-size: 22px;
            margin-left: 4px;
        }

        .play-button.visible {
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .play-button.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .video-wrapper .fallback-msg {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #eee;
            background: #1a1a1a;
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }

        .video-wrapper .fallback-msg i {
            font-size: 40px;
            margin-bottom: 10px;
            color: #ee4d2d;
        }

        /* ===== BLOCO DE CONTEÚDO - POSIÇÃO FIXA NA PARTE INFERIOR ===== */
        .content-wrapper {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            z-index: 2;
            background: white;
            padding-bottom: 8px;
            /* Remove o transform e usa posicionamento absoluto */
        }

        /* Área do produto */
        .product-info {
            padding: 10px 14px 6px 14px;
            background: white;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-name {
            font-weight: 600;
            font-size: clamp(0.8rem, 2.5vw, 1.0rem);
            line-height: 1.3;
            color: #222;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .product-name i {
            color: #ee4d2d;
            font-size: clamp(0.8rem, 2.5vw, 1.0rem);
            margin-right: 4px;
        }

        .promo-banner {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            background: #fff6f3;
            border-radius: 6px;
            padding: 4px 10px;
            margin-bottom: 6px;
            border-left: 3px solid #ee4d2d;
            min-height: 30px;
        }

        .free-shipping {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ee4d2d;
            color: white;
            font-size: clamp(0.55rem, 1.6vw, 0.7rem);
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 16px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .free-shipping i {
            font-size: clamp(0.5rem, 1.4vw, 0.65rem);
        }

        .countdown-text {
            font-size: clamp(0.55rem, 1.6vw, 0.7rem);
            color: #555;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .countdown-text i {
            color: #ee4d2d;
            font-size: clamp(0.5rem, 1.4vw, 0.65rem);
        }

        .countdown-timer {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-weight: 700;
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            color: #ee4d2d;
            background: #fff0ed;
            padding: 2px 10px;
            border-radius: 16px;
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .countdown-timer .time-block {
            display: inline-flex;
            align-items: center;
            gap: 1px;
        }

        .countdown-timer .time-sep {
            color: #ee4d2d;
            font-weight: 300;
            margin: 0 1px;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 2px;
            min-height: 36px;
        }

        .price-current {
            font-size: clamp(1.6rem, 5.5vw, 2.4rem);
            font-weight: 700;
            color: #ee4d2d;
            letter-spacing: -1px;
            line-height: 1.1;
            display: flex;
            align-items: baseline;
        }

        .price-current .currency-symbol {
            font-size: clamp(0.9rem, 2.8vw, 1.2rem);
            font-weight: 700;
            margin-right: 2px;
        }

        .price-current .integer-part {
            font-size: clamp(1.6rem, 5.5vw, 2.4rem);
            font-weight: 700;
        }

        .price-current .decimal-part {
            font-size: clamp(1.0rem, 3.2vw, 1.4rem);
            font-weight: 700;
            margin-left: 1px;
        }

        .price-original {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #999;
            text-decoration: line-through;
            font-weight: 400;
        }

        .discount-badge {
            display: inline-flex;
            align-items: center;
            background: #ee4d2d;
            color: white;
            font-size: clamp(0.6rem, 1.8vw, 0.8rem);
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            letter-spacing: 0.3px;
            gap: 4px;
            white-space: nowrap;
        }

        .discount-badge i {
            font-size: clamp(0.5rem, 1.5vw, 0.7rem);
        }

        /* ===== BOTÃO VER NA SHOPEE ===== */
        .shopee-credit {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 14px 0px 14px;
            padding: 12px 0;
            background: #ee4d2d;
            color: white;
            font-size: clamp(0.8rem, 2.5vw, 1.0rem);
            font-weight: 600;
            border-radius: 40px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(238, 77, 45, 0.2);
            gap: 8px;
            border: none;
            text-decoration: none;
            flex-shrink: 0;
            min-height: 48px;
        }

        .shopee-credit a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            width: 100%;
            height: 100%;
            padding: 12px 0;
        }

        .shopee-credit:hover {
            background: #d63e1e;
            transform: scale(0.98);
        }

        .shopee-credit:active {
            transform: scale(0.95);
        }

            }

            }
            .shopee-credit a {

            }
            .logo-overlay {

            }
            .shopee-credit i {

<body>

    <div class="shopee-card">

        <!-- VÍDEO -->
        <div class="video-wrapper" id="videoWrapper">
            <div class="logo-overlay">
                <img src="imagen/LOGO PNG.png" alt="Logo da marca">
            </div>
            <div class="play-button" id="playButton">
                <i class="fas fa-play"></i>
            </div>
            <video id="productVideo" muted playsinline preload="metadata" loop autoplay>
                <source src="imagen/1.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
            <div class="fallback-msg" style="display: none;">
                <i class="fas fa-play-circle"></i>
                <p>Vídeo indisponível no momento</p>
            </div>
        </div>

        <!-- CONTEÚDO POSICIONADO NA PARTE INFERIOR COM ABSOLUTE -->
        <div class="content-wrapper">

            <div class="product-info">
                <div class="product-name">
                    <i class="fas fa-play-circle"></i>
                    <strong>Smartwatch X Pro</strong> · Edição Limitada
                </div>
                <div class="promo-banner">
                    <span class="free-shipping">
                        <i class="fas fa-truck"></i> Frete Grátis
                    </span>
                    <span class="countdown-text">
                        <i class="fas fa-clock"></i> Compre antes das:
                    </span>
                    <span class="countdown-timer" id="countdown">
                        <span class="time-block">
                            <span id="hours">02</span><span class="time-sep">:</span>
                            <span id="minutes">45</span><span class="time-sep">:</span>
                            <span id="seconds">30</span>
                        </span>
                    </span>
                </div>
                <div class="price-block">
                    <span class="price-current">
                        <span class="currency-symbol">R$</span>
                        <span class="integer-part">249</span>
                        <span class="decimal-part">,90</span>
                    </span>
                    <span class="price-original">R$ 499,00</span>
                    <span class="discount-badge">
                        <i class="fas fa-bolt"></i> -50%
                    </span>
                </div>
            </div>

            <div class="shopee-credit">
                <a href="https://shopee.com.br/product/123456789/" target="_blank" id="shopeeLink">
                    <i class="fas fa-shopping-bag"></i> Ver na Shopee
                </a>
            </div>

        </div>

    </div>

    <script>
        (function() {
            // ===== AJUSTE DINÂMICO DO VÍDEO =====
            function adjustVideoHeight() {
                const card = document.querySelector('.shopee-card');
                const videoWrapper = document.getElementById('videoWrapper');
                const contentWrapper = document.querySelector('.content-wrapper');

                if (!card || !videoWrapper || !contentWrapper) return;

                const cardHeight = card.clientHeight;
                const contentHeight = contentWrapper.offsetHeight;

                // O vídeo ocupa toda a altura do card menos a altura do conteúdo
                let videoHeight = cardHeight - contentHeight;

                if (videoHeight < 60) {
                    videoHeight = 60;
                }

                videoWrapper.style.height = videoHeight + 'px';
                videoWrapper.style.paddingTop = '0';
            }

            window.addEventListener('load', function() {
                setTimeout(adjustVideoHeight, 50);
                setTimeout(adjustVideoHeight, 150);
                setTimeout(adjustVideoHeight, 350);
            });

            window.addEventListener('resize', function() {
                setTimeout(adjustVideoHeight, 50);
            });

            if (window.ResizeObserver) {
                const resizeObserver = new ResizeObserver(function() {
                    adjustVideoHeight();
                });
                const card = document.querySelector('.shopee-card');
                if (card) {
                    resizeObserver.observe(card);
                }
            }

            // ===== CONTROLE DO VÍDEO =====
            const video = document.getElementById('productVideo');
            const playButton = document.getElementById('playButton');

            if (video && playButton) {
                playButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (video.paused) {
                        video.play();
                        playButton.classList.remove('visible');
                        playButton.classList.add('hidden');
                    } else {
                        video.pause();
                        playButton.classList.remove('hidden');
                        playButton.classList.add('visible');
                    }
                });

                video.addEventListener('click', function() {
                    if (video.paused) {
                        video.play();
                        playButton.classList.remove('visible');
                        playButton.classList.add('hidden');
                    } else {
                        video.pause();
                        playButton.classList.remove('hidden');
                        playButton.classList.add('visible');
                    }
                });

                video.addEventListener('pause', function() {
                    playButton.classList.remove('hidden');
                    playButton.classList.add('visible');
                });

                video.addEventListener('play', function() {
                    playButton.classList.remove('visible');
                    playButton.classList.add('hidden');
                });

                video.addEventListener('error', function() {
                    document.querySelector('.fallback-msg').style.display = 'flex';
                    playButton.style.display = 'none';
                });

                playButton.classList.add('hidden');
                playButton.classList.remove('visible');
            }

            // ===== CRONÔMETRO REGRESSIVO =====
            const baseSeconds = Math.floor(Math.random() * (10800 - 3600 + 1)) + 3600;
            let totalSeconds = baseSeconds;
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            function updateTimer() {
                if (totalSeconds <= 0) {
                    totalSeconds = Math.floor(Math.random() * (10800 - 3600 + 1)) + 3600;
                }

                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;

                hoursEl.textContent = String(hrs).padStart(2, '0');
                minutesEl.textContent = String(mins).padStart(2, '0');
                secondsEl.textContent = String(secs).padStart(2, '0');

                totalSeconds--;
            }

            updateTimer();
            setInterval(updateTimer, 1000);

            // ===== LINK DA SHOPEE =====
            const shopeeLink = document.getElementById('shopeeLink');
            if (shopeeLink) {
                console.log('🔗 Link da Shopee: ' + shopeeLink.href);
            }

            console.log('📱 Bloco posicionado com absolute na parte inferior');
        })();
    </script>
</body>
</html>
