<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Destaque Vertical · Shopee</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* remove scroll */
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 0;
    }

    .shopee-card {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 100vh;
      background: #ffffff;
      border-radius: 0;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.07), 0 2px 10px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Container do vídeo - ocupa o máximo de espaço possível */
    .video-wrapper {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #0b0b0b;
      cursor: pointer;
      overflow: hidden;
      /* Altura calculada via JS para se adaptar a qualquer tela */
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      object-fit: cover;
    }

    /* LOGO SOBREPOSTA AO VÍDEO (PNG transparente) */
    .logo-overlay {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      max-width: 80px;
      width: 20%;
      height: auto;
      pointer-events: none;
    }

    .logo-overlay img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    /* Botão de play centralizado */
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: 60px;
      height: 60px;
      background: rgba(238, 77, 45, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(238, 77, 45, 0.4);
      pointer-events: auto;
      opacity: 0;
    }

    .play-button:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(238, 77, 45, 1);
    }

    .play-button i {
      color: white;
      font-size: 28px;
      margin-left: 4px;
    }

    .play-button.visible {
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .play-button.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .video-wrapper .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #888;
      font-size: 14px;
      gap: 12px;
    }

    .video-wrapper .video-placeholder i {
      font-size: 48px;
      color: #ee4d2d;
      opacity: 0.6;
    }

    .video-wrapper .video-placeholder span {
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 0.5px;
    }

    .video-wrapper .fallback-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #eee;
      background: #1a1a1a;
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
    .video-wrapper .fallback-msg i {
      font-size: 40px;
      margin-bottom: 10px;
      color: #ee4d2d;
    }

    /* Área do produto: título + frete grátis + cronômetro + preço */
    .product-info {
      padding: 8px 14px 4px 14px;
      background: white;
      flex-shrink: 0;
    }

    /* Título do produto */
    .product-name {
      font-weight: 500;
      font-size: clamp(0.7rem, 2.2vw, 0.9rem);
      line-height: 1.3;
      color: #222;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .product-name i {
      color: #ee4d2d;
      font-size: clamp(0.7rem, 2.2vw, 0.9rem);
      margin-right: 4px;
    }

    /* FRETE GRÁTIS + COMPRE ANTES DAS... */
    .promo-banner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 3px 6px;
      background: #fff6f3;
      border-radius: 6px;
      padding: 3px 8px;
      margin-bottom: 4px;
      border-left: 3px solid #ee4d2d;
    }

    .free-shipping {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #ee4d2d;
      color: white;
      font-size: clamp(0.45rem, 1.4vw, 0.6rem);
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 16px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .free-shipping i {
      font-size: clamp(0.4rem, 1.2vw, 0.55rem);
    }

    .countdown-text {
      font-size: clamp(0.5rem, 1.5vw, 0.65rem);
      color: #555;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .countdown-text i {
      color: #ee4d2d;
      font-size: clamp(0.45rem, 1.3vw, 0.6rem);
    }

    .countdown-timer {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-weight: 700;
      font-size: clamp(0.55rem, 1.8vw, 0.75rem);
      color: #ee4d2d;
      background: #fff0ed;
      padding: 1px 6px;
      border-radius: 16px;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    .countdown-timer .time-block {
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }

    .countdown-timer .time-sep {
      color: #ee4d2d;
      font-weight: 300;
      margin: 0 1px;
    }

    /* Bloco de preço e promoção */
    .price-block {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 3px 8px;
      margin-top: 2px;
    }

    .price-current {
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      font-weight: 700;
      color: #ee4d2d;
      letter-spacing: -1px;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
    }

    .price-current .currency-symbol {
      font-size: clamp(0.7rem, 2.5vw, 1.1rem);
      font-weight: 700;
      margin-right: 1px;
    }

    .price-current .integer-part {
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      font-weight: 700;
    }

    .price-current .decimal-part {
      font-size: clamp(0.8rem, 3vw, 1.2rem);
      font-weight: 700;
      margin-left: 1px;
    }

    .price-original {
      font-size: clamp(0.55rem, 1.8vw, 0.8rem);
      color: #999;
      text-decoration: line-through;
      font-weight: 400;
    }

    .discount-badge {
      display: inline-flex;
      align-items: center;
      background: #ee4d2d;
      color: white;
      font-size: clamp(0.5rem, 1.6vw, 0.7rem);
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 30px;
      letter-spacing: 0.3px;
      gap: 3px;
      white-space: nowrap;
    }

    .discount-badge i {
      font-size: clamp(0.45rem, 1.4vw, 0.65rem);
    }

    /* Botão VER NA SHOPEE */
    .shopee-credit {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 14px 8px 14px;
      padding: 6px 0;
      background: #ee4d2d;
      color: white;
      font-size: clamp(0.6rem, 2vw, 0.85rem);
      font-weight: 600;
      border-radius: 40px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(238, 77, 45, 0.2);
      gap: 8px;
      border: none;
      text-decoration: none;
      flex-shrink: 0;
    }

    .shopee-credit a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      width: 100%;
      height: 100%;
      padding: 6px 0;
    }

    .shopee-credit:hover {
      background: #d63e1e;
      transform: scale(0.98);
    }

    .shopee-credit:active {
      transform: scale(0.95);
    }

    /* Ajustes para telas muito pequenas */
    @media (max-height: 600px) {
      .logo-overlay {
        max-width: 50px;
        top: 6px;
      }
      .play-button {
        width: 40px;
        height: 40px;
      }
      .play-button i {
        font-size: 18px;
      }
      .product-info {
        padding: 4px 10px 2px 10px;
      }
      .promo-banner {
        padding: 2px 6px;
        gap: 2px 4px;
      }
      .shopee-credit {
        padding: 4px 0;
        margin: 2px 10px 4px 10px;
      }
      .shopee-credit a {
        padding: 4px 0;
      }
    }

    @media (max-height: 450px) {
      .logo-overlay {
        max-width: 35px;
        top: 4px;
      }
      .play-button {
        width: 30px;
        height: 30px;
      }
      .play-button i {
        font-size: 14px;
      }
      .product-info {
        padding: 2px 8px 1px 8px;
      }
      .product-name {
        margin-bottom: 2px;
      }
      .promo-banner {
        padding: 1px 4px;
        margin-bottom: 2px;
      }
      .price-block {
        margin-top: 1px;
        gap: 2px 4px;
      }
      .shopee-credit {
        padding: 2px 0;
        margin: 2px 8px 3px 8px;
        font-size: clamp(0.5rem, 1.8vw, 0.7rem);
      }
      .shopee-credit a {
        padding: 2px 0;
      }
    }

    @media (max-width: 350px) {
      .logo-overlay {
        max-width: 40px;
        top: 6px;
      }
      .product-name {
        font-size: clamp(0.6rem, 2vw, 0.75rem);
      }
      .price-current {
        font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      }
      .price-current .integer-part {
        font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      }
      .price-current .decimal-part {
        font-size: clamp(0.7rem, 2.8vw, 0.9rem);
      }
    }

    .fa-play-circle {
      color: #ee4d2d;
    }
  </style>
</head>
<body>

<div class="shopee-card">

  <!-- VÍDEO DE DESTAQUE – ocupa o espaço restante -->
  <div class="video-wrapper" id="videoWrapper">
    <!-- Logo PNG sobreposta ao vídeo -->
    <div class="logo-overlay">
      <img src="imagen/LOGO PNG.png" alt="Logo da marca">
    </div>

    <!-- Botão de play centralizado -->
    <div class="play-button" id="playButton">
      <i class="fas fa-play"></i>
    </div>

    <!-- Vídeo local com loop e autoplay -->
    <video id="productVideo" muted playsinline preload="metadata" loop autoplay>
      <source src="imagen/1.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>
    
    <div class="video-placeholder" style="display: none;">
      <i class="fas fa-play-circle"></i>
      <span>Adicione seu vídeo aqui</span>
    </div>
    
    <div class="fallback-msg" style="display: none;">
      <i class="fas fa-play-circle"></i>
      <p>Vídeo indisponível no momento</p>
    </div>
  </div>

  <!-- INFORMAÇÕES DO PRODUTO -->
  <div class="product-info">
    <!-- Título -->
    <div class="product-name">
      <i class="fas fa-play-circle"></i>
      <strong>Smartwatch X Pro</strong> · Edição Limitada
    </div>

    <!-- FRETE GRÁTIS + COMPRE ANTES DAS... + CRONÔMETRO -->
    <div class="promo-banner">
      <span class="free-shipping">
        <i class="fas fa-truck"></i> Frete Grátis
      </span>
      <span class="countdown-text">
        <i class="fas fa-clock"></i> Compre antes das:
      </span>
      <span class="countdown-timer" id="countdown">
        <span class="time-block">
          <span id="hours">02</span><span class="time-sep">:</span>
          <span id="minutes">45</span><span class="time-sep">:</span>
          <span id="seconds">30</span>
        </span>
      </span>
    </div>

    <!-- Preço com "90" menor -->
    <div class="price-block">
      <span class="price-current">
        <span class="currency-symbol">R$</span>
        <span class="integer-part">249</span>
        <span class="decimal-part">,90</span>
      </span>
      <span class="price-original">R$ 499,00</span>
      <span class="discount-badge">
        <i class="fas fa-bolt"></i> -50%
      </span>
    </div>
  </div>

  <!-- BOTÃO VER NA SHOPEE -->
  <div class="shopee-credit">
    <a href="https://shopee.com.br/product/123456789/" target="_blank" id="shopeeLink">
      <i class="fas fa-shopping-bag"></i> Ver na Shopee
    </a>
  </div>

</div>

<script>
  (function() {
    // ===== AJUSTE DINÂMICO DO VÍDEO =====
    function adjustVideoHeight() {
      const card = document.querySelector('.shopee-card');
      const videoWrapper = document.getElementById('videoWrapper');
      const productInfo = document.querySelector('.product-info');
      const shopeeBtn = document.querySelector('.shopee-credit');
      
      if (!card || !videoWrapper) return;
      
      // Calcula a altura disponível para o vídeo
      const cardHeight = card.clientHeight;
      const infoHeight = productInfo ? productInfo.offsetHeight : 0;
      const btnHeight = shopeeBtn ? shopeeBtn.offsetHeight : 0;
      const padding = 0; // sem padding extra
      
      // O vídeo ocupa todo o espaço restante
      const videoHeight = cardHeight - infoHeight - btnHeight;
      
      if (videoHeight > 0) {
        videoWrapper.style.height = videoHeight + 'px';
        // Remove o padding-top para usar height fixa
        videoWrapper.style.paddingTop = '0';
      }
    }

    // Ajusta ao carregar e ao redimensionar
    window.addEventListener('load', function() {
      setTimeout(adjustVideoHeight, 100);
    });
    window.addEventListener('resize', adjustVideoHeight);
    
    // Também ajusta quando o conteúdo mudar (ex: cronômetro)
    setTimeout(adjustVideoHeight, 200);
    setTimeout(adjustVideoHeight, 500);

    // ===== CONTROLE DO VÍDEO =====
    const video = document.getElementById('productVideo');
    const playButton = document.getElementById('playButton');

    if (video && playButton) {
      // Toca/pausa ao clicar no botão
      playButton.addEventListener('click', function(e) {
        e.stopPropagation();
        if (video.paused) {
          video.play();
          playButton.classList.remove('visible');
          playButton.classList.add('hidden');
        } else {
          video.pause();
          playButton.classList.remove('hidden');
          playButton.classList.add('visible');
        }
      });

      // Toca/pausa ao clicar no vídeo
      video.addEventListener('click', function() {
        if (video.paused) {
          video.play();
          playButton.classList.remove('visible');
          playButton.classList.add('hidden');
        } else {
          video.pause();
          playButton.classList.remove('hidden');
          playButton.classList.add('visible');
        }
      });

      // Mostra o botão quando o vídeo é pausado
      video.addEventListener('pause', function() {
        playButton.classList.remove('hidden');
        playButton.classList.add('visible');
      });

      // Esconde o botão quando o vídeo começa a tocar
      video.addEventListener('play', function() {
        playButton.classList.remove('visible');
        playButton.classList.add('hidden');
      });

      // Se o vídeo falhar ao carregar
      video.addEventListener('error', function() {
        document.querySelector('.fallback-msg').style.display = 'flex';
        playButton.style.display = 'none';
      });

      // Garante que o botão comece invisível
      playButton.classList.add('hidden');
      playButton.classList.remove('visible');
    }

    // ===== CRONÔMETRO REGRESSIVO =====
    const baseSeconds = Math.floor(Math.random() * (10800 - 3600 + 1)) + 3600;
    let totalSeconds = baseSeconds;
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function updateTimer() {
      if (totalSeconds <= 0) {
        totalSeconds = Math.floor(Math.random() * (10800 - 3600 + 1)) + 3600;
      }

      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      hoursEl.textContent = String(hrs).padStart(2, '0');
      minutesEl.textContent = String(mins).padStart(2, '0');
      secondsEl.textContent = String(secs).padStart(2, '0');

      totalSeconds--;
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    // ===== LINK DA SHOPEE =====
    const shopeeLink = document.getElementById('shopeeLink');
    if (shopeeLink) {
      console.log('🔗 Link da Shopee: ' + shopeeLink.href);
    }

    console.log('📱 Totalmente adaptável a qualquer tela, sem scroll');
  })();
</script>
</body>
</html>
